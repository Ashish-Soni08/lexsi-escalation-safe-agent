<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="GRPO on one blocked task. The model makes eight attempts; five stop honestly (+0.6), two escalate (-1) and one makes up a number (-0.6). The group average is +0.05. Attempts above the average are made more likely and attempts below it less likely." font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>GRPO on one blocked task. The model makes eight attempts; five stop honestly (+0.6), two escalate (-1) and one makes up a number (-0.6). The group average is +0.05. Attempts above the average are made more likely and attempts below it less likely.</title>
<defs><marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a8399"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6c36"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14a06f"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f5d75"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#7a8399" stroke-width="1.6" opacity=".55"/></pattern></defs>
<rect width="820" height="270" rx="8" fill="#f5f5f5"/>
<text x="24" y="30" font-size="14" fill="#2d3142" text-anchor="start" font-weight="700">One blocked task, 8 attempts, each scored by the safe reward</text>
<line x1="96" y1="44.0" x2="96" y2="216.0" stroke="#7a8399" stroke-width="1.2" opacity="1"/>
<line x1="92" y1="48" x2="96" y2="48" stroke="#7a8399" stroke-width="1.2" opacity="1"/>
<text x="88" y="52" font-size="11" fill="#4f5d75" text-anchor="end" font-weight="400">+1</text>
<line x1="92" y1="88.0" x2="96" y2="88.0" stroke="#7a8399" stroke-width="1.2" opacity="1"/>
<text x="88" y="92.0" font-size="11" fill="#4f5d75" text-anchor="end" font-weight="400">+0.5</text>
<line x1="92" y1="128" x2="96" y2="128" stroke="#7a8399" stroke-width="1.2" opacity="1"/>
<text x="88" y="132" font-size="11" fill="#4f5d75" text-anchor="end" font-weight="400">0</text>
<line x1="92" y1="168.0" x2="96" y2="168.0" stroke="#7a8399" stroke-width="1.2" opacity="1"/>
<text x="88" y="172.0" font-size="11" fill="#4f5d75" text-anchor="end" font-weight="400">-0.5</text>
<line x1="92" y1="208" x2="96" y2="208" stroke="#7a8399" stroke-width="1.2" opacity="1"/>
<text x="88" y="212" font-size="11" fill="#4f5d75" text-anchor="end" font-weight="400">-1</text>
<text x="40" y="132" font-size="11" fill="#4f5d75" text-anchor="end" font-weight="400">score</text>
<line x1="96" y1="124.0" x2="548" y2="124.0" stroke="#2d3142" stroke-width="1.2" opacity="1" stroke-dasharray="6 4"/>
<text x="554" y="128.0" font-size="12" fill="#2d3142" text-anchor="start" font-weight="600">group average +0.05</text>
<line x1="140" y1="124.0" x2="140" y2="80.0" stroke="#14a06f" stroke-width="3" opacity="0.55"/>
<circle cx="140" cy="80.0" r="7" fill="#14a06f" stroke="#f5f5f5" stroke-width="2"/>
<text x="140" y="232" font-size="11" fill="#14a06f" text-anchor="middle" font-weight="600">stop</text>
<text x="140" y="248" font-size="10.5" fill="#4f5d75" text-anchor="middle" font-weight="400">+0.6</text>
<line x1="194" y1="124.0" x2="194" y2="208" stroke="#eb6c36" stroke-width="3" opacity="0.55"/>
<circle cx="194" cy="208" r="7" fill="#eb6c36" stroke="#f5f5f5" stroke-width="2"/>
<text x="194" y="232" font-size="11" fill="#eb6c36" text-anchor="middle" font-weight="600">escalate</text>
