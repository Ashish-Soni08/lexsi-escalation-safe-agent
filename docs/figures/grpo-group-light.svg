<text x="248" y="248" font-size="10.5" fill="#4f5d75" text-anchor="middle" font-weight="400">+0.6</text>
<line x1="302" y1="124.0" x2="302" y2="176.0" stroke="#c98a00" stroke-width="3" opacity="0.55"/>
<circle cx="302" cy="176.0" r="7" fill="#c98a00" stroke="#f5f5f5" stroke-width="2"/>
<text x="302" y="232" font-size="11" fill="#c98a00" text-anchor="middle" font-weight="600">made-up</text>
<text x="302" y="248" font-size="10.5" fill="#4f5d75" text-anchor="middle" font-weight="400">-0.6</text>
<line x1="356" y1="124.0" x2="356" y2="80.0" stroke="#14a06f" stroke-width="3" opacity="0.55"/>
<circle cx="356" cy="80.0" r="7" fill="#14a06f" stroke="#f5f5f5" stroke-width="2"/>
<text x="356" y="232" font-size="11" fill="#14a06f" text-anchor="middle" font-weight="600">stop</text>
<text x="356" y="248" font-size="10.5" fill="#4f5d75" text-anchor="middle" font-weight="400">+0.6</text>
<line x1="410" y1="124.0" x2="410" y2="80.0" stroke="#14a06f" stroke-width="3" opacity="0.55"/>
<circle cx="410" cy="80.0" r="7" fill="#14a06f" stroke="#f5f5f5" stroke-width="2"/>
<text x="410" y="232" font-size="11" fill="#14a06f" text-anchor="middle" font-weight="600">stop</text>
<text x="410" y="248" font-size="10.5" fill="#4f5d75" text-anchor="middle" font-weight="400">+0.6</text>
<line x1="464" y1="124.0" x2="464" y2="208" stroke="#eb6c36" stroke-width="3" opacity="0.55"/>
<circle cx="464" cy="208" r="7" fill="#eb6c36" stroke="#f5f5f5" stroke-width="2"/>
<text x="464" y="232" font-size="11" fill="#eb6c36" text-anchor="middle" font-weight="600">escalate</text>
<text x="464" y="248" font-size="10.5" fill="#4f5d75" text-anchor="middle" font-weight="400">-1</text>
<line x1="518" y1="124.0" x2="518" y2="80.0" stroke="#14a06f" stroke-width="3" opacity="0.55"/>
<circle cx="518" cy="80.0" r="7" fill="#14a06f" stroke="#f5f5f5" stroke-width="2"/>
<text x="518" y="232" font-size="11" fill="#14a06f" text-anchor="middle" font-weight="600">stop</text>
<text x="518" y="248" font-size="10.5" fill="#4f5d75" text-anchor="middle" font-weight="400">+0.6</text>
<line x1="562" y1="86.0" x2="562" y2="62.0" stroke="#14a06f" stroke-width="2" opacity="1" marker-end="url(#ar-green)"/>
<text x="576" y="74.0" font-size="12" fill="#14a06f" text-anchor="start" font-weight="600">above average:</text>
<text x="576" y="89.0" font-size="12" fill="#4f5d75" text-anchor="start" font-weight="400">made more likely</text>
<line x1="562" y1="180.0" x2="562" y2="204.0" stroke="#eb6c36" stroke-width="2" opacity="1" marker-end="url(#ar-orange)"/>
<text x="576" y="190.0" font-size="12" fill="#eb6c36" text-anchor="start" font-weight="600">below average:</text>
<text x="576" y="205.0" font-size="12" fill="#4f5d75" text-anchor="start" font-weight="400">made less likely</text>
<text x="24" y="262" font-size="11" fill="#4f5d75" text-anchor="start" font-weight="400" font-style="italic">Stems show each attempt's distance from the average (its advantage). Illustrative group.</text>
</svg>
