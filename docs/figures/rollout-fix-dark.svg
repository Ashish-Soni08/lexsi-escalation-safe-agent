<text x="414.0" y="69" font-size="11" fill="#f2b937" text-anchor="middle" font-weight="700" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;tool&gt;</text>
<rect x="445" y="46" width="130" height="36" rx="5" fill="#393e53" fill-opacity="1" stroke="#8e98ac" stroke-width="1.1"/>
<text x="510.0" y="69" font-size="11.5" fill="#bfc0c0" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">result</text>
