<text x="24" y="76" font-size="11" fill="#bfc0c0" text-anchor="start" font-weight="400">what vLLM produced</text>
<rect x="190" y="46" width="96" height="36" rx="5" fill="#393e53" fill-opacity="1" stroke="#8e98ac" stroke-width="1.1"/>
<text x="238.0" y="69" font-size="11.5" fill="#bfc0c0" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">question</text>
