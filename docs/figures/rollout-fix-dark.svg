<text x="337.0" y="119" font-size="11.5" fill="#6aa9f5" text-anchor="middle" font-weight="600">tool call 1</text>
<rect x="388" y="96" width="250" height="36" rx="5" fill="#393e53" fill-opacity="1" stroke="#8e98ac" stroke-width="1.1"/>
<text x="513.0" y="119" font-size="11.5" fill="#bfc0c0" text-anchor="middle" font-weight="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">raw result, no template</text>
<rect x="643" y="96" width="92" height="36" rx="5" fill="#f08a59" fill-opacity="0.14" stroke="#f08a59" stroke-width="2"/>
<text x="689.0" y="119" font-size="11.5" fill="#f08a59" text-anchor="middle" font-weight="700">tool call 2</text>
<rect x="740" y="96" width="78" height="36" rx="5" fill="#f08a59" fill-opacity="0.14" stroke="#f08a59" stroke-width="2"/>
<text x="779.0" y="119" font-size="11.5" fill="#f08a59" text-anchor="middle" font-weight="700">answer</text>
<text x="728" y="150" font-size="11.5" fill="#f08a59" text-anchor="middle" font-weight="600">scored in a context the sampler never saw:</text>
<text x="728" y="165" font-size="11.5" fill="#f08a59" text-anchor="middle" font-weight="600">ratio ≈ 1e-6 → masked → zero gradient</text>
