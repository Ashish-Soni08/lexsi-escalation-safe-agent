<rect x="580" y="222" width="58" height="36" rx="5" fill="#f2b937" fill-opacity="0.22" stroke="#f2b937" stroke-width="1.3"/>
<text x="609.0" y="245" font-size="11" fill="#f2b937" text-anchor="middle" font-weight="700" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">&lt;/tool&gt;</text>
<rect x="643" y="222" width="92" height="36" rx="5" fill="#6aa9f5" fill-opacity="0.14" stroke="#6aa9f5" stroke-width="1.3"/>
