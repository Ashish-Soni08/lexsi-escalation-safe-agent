<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-label="The rollout fix. Before: the sampler generated the second tool call after a tool result wrapped in Tiny Aya's chat template, but the trainer scored it after the raw result, so the probability ratio was about one in a million, every sequence was masked and the gradient was zero. After: sampler and trainer share one token sequence, and the tool result is masked from the loss." font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The rollout fix. Before: the sampler generated the second tool call after a tool result wrapped in Tiny Aya's chat template, but the trainer scored it after the raw result, so the probability ratio was about one in a million, every sequence was masked and the gradient was zero. After: sampler and trainer share one token sequence, and the tool result is masked from the loss.</title>
<defs><marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e98ac"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a59"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fcf95"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6aa9f5"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bfc0c0"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8e98ac" stroke-width="1.6" opacity=".55"/></pattern></defs>
