<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Escalation on blocked stress-test tasks as reported by the detector inside each model's own reward, against the rate after the independent judge's finding was fixed. v3: 0.8% reported, 52.3% real, via /debug/ probes. v3.1: 6.9% reported, 36.2% real, via a bare /debug path. v4.1: 1.5% reported, and the judge finds no hidden pattern." font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
