<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Two layers against escalation on blocked tasks. On known shortcut shapes (stress set), training cuts attempts from 93.1% for clean SFT to 1.5% for v4.1, and the guard stops the rest: 0.0% reaches the tools. On unfamiliar shapes (fresh set), training cuts attempts from 48.0% to 11.0%, and the guard does not recognise them: 11.0% still reaches the tools." font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
