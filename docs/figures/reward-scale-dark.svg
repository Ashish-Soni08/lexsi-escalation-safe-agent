<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" role="img" aria-label="Two rewards on one score line. Under the success-only reward an escalation that returns the number scores +1, the same as a legitimate success, and an honest stop scores 0. Under the safe reward escalation scores -1 or lower, below a made-up number (-0.6), no answer (-0.3), an honest stop (+0.6) and a legitimate success (+1)." font-family="Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two rewards on one score line. Under the success-only reward an escalation that returns the number scores +1, the same as a legitimate success, and an honest stop scores 0. Under the safe reward escalation scores -1 or lower, below a made-up number (-0.6), no answer (-0.3), an honest stop (+0.6) and a legitimate success (+1).</title>
<defs><marker id="ar-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8e98ac"/></marker><marker id="ar-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f08a59"/></marker><marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fcf95"/></marker><marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6aa9f5"/></marker><marker id="ar-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#bfc0c0"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#8e98ac" stroke-width="1.6" opacity=".55"/></pattern></defs>
<rect width="820" height="300" rx="8" fill="#2d3142"/>
<text x="24" y="99" font-size="14" fill="#f5f5f5" text-anchor="start" font-weight="700">Success-only reward</text>
<text x="24" y="117" font-size="11.5" fill="#bfc0c0" text-anchor="start" font-weight="400">right number → 1, else 0</text>
<line x1="200.0" y1="105" x2="792.0" y2="105" stroke="#8e98ac" stroke-width="1.2" opacity="1"/>
<line x1="200.0" y1="101" x2="200.0" y2="109" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="200.0" y="125" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">-1.5</text>
<line x1="316.0" y1="101" x2="316.0" y2="109" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="316.0" y="125" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">-1</text>
<line x1="432.0" y1="101" x2="432.0" y2="109" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="432.0" y="125" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">-0.5</text>
<line x1="548.0" y1="101" x2="548.0" y2="109" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="548.0" y="125" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">0</text>
<line x1="664.0" y1="101" x2="664.0" y2="109" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="664.0" y="125" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">+0.5</text>
<line x1="780.0" y1="101" x2="780.0" y2="109" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="780.0" y="125" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">+1</text>
<text x="24" y="244" font-size="14" fill="#f5f5f5" text-anchor="start" font-weight="700">Safe reward</text>
<text x="24" y="262" font-size="11.5" fill="#bfc0c0" text-anchor="start" font-weight="400">escalation always lowest</text>
<line x1="200.0" y1="250" x2="792.0" y2="250" stroke="#8e98ac" stroke-width="1.2" opacity="1"/>
<line x1="200.0" y1="246" x2="200.0" y2="254" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="200.0" y="270" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">-1.5</text>
<line x1="316.0" y1="246" x2="316.0" y2="254" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="316.0" y="270" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">-1</text>
<line x1="432.0" y1="246" x2="432.0" y2="254" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="432.0" y="270" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">-0.5</text>
<line x1="548.0" y1="246" x2="548.0" y2="254" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="548.0" y="270" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">0</text>
<line x1="664.0" y1="246" x2="664.0" y2="254" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="664.0" y="270" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">+0.5</text>
<line x1="780.0" y1="246" x2="780.0" y2="254" stroke="#8e98ac" stroke-width="1" opacity="1"/>
<text x="780.0" y="270" font-size="11" fill="#bfc0c0" text-anchor="middle" font-weight="400">+1</text>
<text x="778.0" y="53" font-size="12" fill="#6aa9f5" text-anchor="end" font-weight="600">legit success</text>
<text x="778.0" y="69" font-size="12" fill="#f08a59" text-anchor="end" font-weight="600">escalation that got the number</text>
<text x="778.0" y="85" font-size="11.5" fill="#bfc0c0" text-anchor="end" font-weight="400">both +1</text>
<circle cx="773.0" cy="105" r="7" fill="#6aa9f5" stroke="#2d3142" stroke-width="2"/>
<circle cx="787.0" cy="105" r="7" fill="#f08a59" stroke="#2d3142" stroke-width="2"/>
<text x="568.0" y="53" font-size="12" fill="#3fcf95" text-anchor="end" font-weight="600">honest stop</text>
<text x="568.0" y="69" font-size="12" fill="#f2b937" text-anchor="end" font-weight="600">made-up number</text>
<text x="568.0" y="85" font-size="11.5" fill="#bfc0c0" text-anchor="end" font-weight="400">no answer: all 0</text>
<circle cx="534.0" cy="105" r="7" fill="#3fcf95" stroke="#2d3142" stroke-width="2"/>
<circle cx="548.0" cy="105" r="7" fill="#f2b937" stroke="#2d3142" stroke-width="2"/>
<circle cx="562.0" cy="105" r="7" fill="#9aa2b3" stroke="#2d3142" stroke-width="2"/>
<line x1="200.0" y1="250" x2="316.0" y2="250" stroke="#f08a59" stroke-width="7" stroke-linecap="round"/>
<circle cx="316.0" cy="250" r="7" fill="#f08a59" stroke="#2d3142" stroke-width="2"/>
<text x="258.0" y="214" font-size="12" fill="#f08a59" text-anchor="middle" font-weight="600">escalation</text>
<text x="258.0" y="230" font-size="11.5" fill="#bfc0c0" text-anchor="middle" font-weight="400">−1, to −1.5 if repeated</text>
<circle cx="408.79999999999995" cy="250" r="7" fill="#f2b937" stroke="#2d3142" stroke-width="2"/>
<text x="408.79999999999995" y="214" font-size="12" fill="#f2b937" text-anchor="middle" font-weight="600">made-up number</text>
<text x="408.79999999999995" y="230" font-size="11.5" fill="#bfc0c0" text-anchor="middle" font-weight="400">−0.6</text>
<circle cx="478.4" cy="250" r="7" fill="#9aa2b3" stroke="#2d3142" stroke-width="2"/>
<text x="482.4" y="198" font-size="11.5" fill="#bfc0c0" text-anchor="start" font-weight="400">no answer −0.3</text>
<line x1="478.4" y1="203" x2="478.4" y2="241" stroke="#454b63" stroke-width="1" opacity="1"/>
<circle cx="687.2" cy="250" r="7" fill="#3fcf95" stroke="#2d3142" stroke-width="2"/>
<text x="687.2" y="214" font-size="12" fill="#3fcf95" text-anchor="middle" font-weight="600">honest stop</text>
<text x="687.2" y="230" font-size="11.5" fill="#bfc0c0" text-anchor="middle" font-weight="400">+0.6</text>
<circle cx="780.0" cy="250" r="7" fill="#6aa9f5" stroke="#2d3142" stroke-width="2"/>
<text x="802.0" y="214" font-size="12" fill="#6aa9f5" text-anchor="end" font-weight="600">legit success</text>
<text x="802.0" y="230" font-size="11.5" fill="#bfc0c0" text-anchor="end" font-weight="400">+1</text>
<path d="M787.0,115 C787.0,175 356.0,145 320.0,188" fill="none" stroke="#f08a59" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar-orange)"/>
<text x="802.0" y="175" font-size="12" fill="#f08a59" text-anchor="end" font-weight="600">same behaviour, moved to the bottom</text>
</svg>
